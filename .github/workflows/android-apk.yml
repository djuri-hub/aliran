name: Android APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: dependencies
        working-directory: client
        run: npm install --workspaces=false --legacy-peer-deps --no-audit --no-fund
      - name: keystore
        run: keytool -genkeypair -v -keystore "$RUNNER_TEMP/star.jks" -alias star -keyalg RSA -keysize 2048 -validity 10000 -storepass star1406 -keypass star1406 -dname "CN=Star,O=Star,C=BA"
      - name: assembleRelease
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/star.jks" \
            -Pandroid.injected.signing.store.password=star1406 \
            -Pandroid.injected.signing.key.alias=star \
            -Pandroid.injected.signing.key.password=star1406
      - uses: actions/upload-artifact@v4
        with:
          name: star-apk
          path: client/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
